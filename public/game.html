<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>星联精密 · 模具工厂</title>
<style>
:root{--bg:#070b11;--panel:#0f141d;--panel2:#0b0f16;--elev:#17222f;--border:rgba(120,170,210,.10);--border2:rgba(120,170,210,.22);--txt:#e8eef5;--dim:#8c99a8;--faint:#586472;--cyan:#39d0ff;--blue:#5b8bff;--green:#3ddc97;--amber:#ffb24a;--red:#ff6b7b;--violet:#a78bfa;--grad:linear-gradient(135deg,var(--cyan),var(--blue));--shadow:0 10px 34px rgba(0,0,0,.5);--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;--sans:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.55 var(--sans);color:var(--txt);overflow:hidden;background:radial-gradient(1100px 560px at 86% -12%,rgba(57,208,255,.11),transparent 60%),radial-gradient(880px 540px at -12% 112%,rgba(91,139,255,.09),transparent 60%),var(--bg)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#1d2733;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#283544}::-webkit-scrollbar-track{background:transparent}
header{height:58px;display:flex;align-items:center;gap:18px;padding:0 18px;background:rgba(7,11,17,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:relative;z-index:6}
.mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--grad);font-weight:800;font-size:16px;color:#04111a;box-shadow:0 2px 16px rgba(57,208,255,.45)}
.brand{display:flex;align-items:center;gap:11px;min-width:230px}.brand h1{font-size:14.5px;margin:0;font-weight:700}.brand .sub{font-size:10px;color:var(--faint);font-family:var(--mono);letter-spacing:1.4px;text-transform:uppercase}
.status{display:flex;align-items:center;gap:9px;margin-left:auto;margin-right:auto;padding:6px 15px;border-radius:30px;background:var(--panel);border:1px solid var(--border);font-size:12.5px;color:var(--dim)}.status .si{width:7px;height:7px;border-radius:50%;background:var(--cyan)}
.top-conn{display:flex;align-items:center;gap:11px;font-size:12px;color:var(--dim)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(61,220,151,.6);animation:pulse 2.4s ease infinite}
.btn{background:transparent;border:1px solid var(--border2);color:var(--dim);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;transition:.15s}.btn:hover{border-color:var(--cyan);color:var(--txt)}.btn.danger:hover{border-color:var(--red);color:var(--red);background:rgba(255,107,123,.08)}
main{display:grid;grid-template-columns:360px 1fr 300px;gap:13px;padding:13px;height:calc(100vh - 58px)}.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--border);flex:0 0 auto}.card-h .t{font-size:11px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;font-weight:700}.card-h .n{margin-left:auto;font-size:11px;color:var(--cyan);font-family:var(--mono);background:rgba(57,208,255,.10);padding:1px 9px;border-radius:20px}
.card-body{flex:1;overflow-y:auto;min-height:0}
.kbar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}.kbar .k{padding:12px 15px;background:var(--panel);display:flex;flex-direction:column;gap:5px}.kbar .kl{font-size:10px;color:var(--faint);letter-spacing:1.3px;text-transform:uppercase;font-family:var(--mono)}.kbar .kv{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1;transition:color .3s}.kbar .cash .kv{color:var(--green)}.kbar .rep .kv{color:var(--cyan)}.kbar .shift .kv{color:var(--amber)}.kbar .tech .kv{color:var(--violet)}.kbar .kv.bump{animation:bump .5s cubic-bezier(.2,.9,.3,1)}.kg{height:4px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:2px}.kg i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.banner{margin:11px 14px 0;padding:9px 13px;border-radius:11px;display:flex;align-items:center;gap:10px;font-size:12.5px;background:linear-gradient(90deg,rgba(255,178,74,.15),rgba(255,107,123,.10));border:1px solid rgba(255,178,74,.32);color:#ffd9a3;animation:glow 1.6s ease infinite}.banner.hide{display:none}
.spot{margin:11px 14px 0;padding:8px 14px;border-radius:11px;display:flex;align-items:center;gap:11px;font-size:12.5px;background:linear-gradient(90deg,rgba(57,208,255,.10),rgba(91,139,255,.06));border:1px solid rgba(57,208,255,.25);color:var(--txt)}.spot.hide{display:none}.spot .sic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(57,208,255,.13);border:1px solid rgba(57,208,255,.3);flex:0 0 auto;font-size:14px}.spot .stx{flex:1}.spot .stx b{color:var(--cyan);font-family:var(--mono)}.spot .sic.spinic{animation:spin 2.4s linear infinite}.spot.flash{animation:spotflash .9s ease}
.floor{padding:14px;background-color:var(--panel2);background-image:linear-gradient(rgba(120,170,210,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,210,.045) 1px,transparent 1px);background-size:26px 26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
.mc{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px;transition:border-color .35s,box-shadow .35s,opacity .35s;overflow:hidden}.mc .mh{display:flex;align-items:center;gap:9px}.mc .gear{width:38px;height:38px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--border2)}.mc .gear svg{width:25px;height:25px;fill:var(--faint);transition:fill .35s}.mc .mn{font-size:12.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mc .mt{font-size:10px;color:var(--faint);font-family:var(--mono)}.mc .mj{font-size:11px;color:var(--dim);margin-top:8px;min-height:15px;font-family:var(--mono)}.mc .mj b{color:var(--amber);font-weight:600}.mc .mj .mal{color:var(--red);font-weight:600}.mc .mp{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:8px;border:1px solid var(--border)}.mc .mp i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.mc.running{border-color:rgba(57,208,255,.5);box-shadow:0 0 0 1px rgba(57,208,255,.22),0 0 26px rgba(57,208,255,.12)}.mc.running .gear svg{fill:var(--cyan);animation:spin 2s linear infinite;filter:drop-shadow(0 0 6px rgba(57,208,255,.8))}.mc.running .mp i{background:linear-gradient(90deg,var(--cyan),var(--green),var(--cyan));background-size:200% 100%;animation:flowbar 1.4s linear infinite}
.mc.broken{border-color:rgba(255,107,123,.55);animation:shake .3s ease 4}.mc.broken .gear svg{fill:var(--red)}.mc.broken .mn{color:var(--red)}.mc.idle{opacity:.62}.mc.flash{animation:mcflash .9s ease}
.pipe-wrap{position:relative}.pipe-wrap::before{content:"";position:absolute;left:18px;right:18px;top:46px;height:2px;background:repeating-linear-gradient(90deg,rgba(57,208,255,.22) 0 6px,transparent 6px 12px);background-size:12px 100%;animation:flow .7s linear infinite;opacity:.6;pointer-events:none;z-index:1}
.pipe{display:flex;gap:0;padding:14px;overflow-x:auto;position:relative}.station{flex:1;min-width:120px;display:flex;flex-direction:column;gap:9px;position:relative}.station:not(:last-child){margin-right:16px}.st-head{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;font-family:var(--mono);padding:5px 9px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);position:relative;z-index:1}.st-head .st-c{margin-left:auto;color:var(--cyan);background:rgba(57,208,255,.12);padding:1px 7px;border-radius:10px;font-size:10px}.st-body{display:flex;flex-direction:column;gap:8px;min-height:48px;position:relative;z-index:1}
.ochip{background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11px;transition:border-color .3s,box-shadow .3s,transform .3s}.ochip .oc-cust{font-weight:700;font-size:12px}.ochip .oc-id{font-family:var(--mono);font-size:9.5px;color:var(--faint)}.ochip .oc-meta{color:var(--cyan);font-size:10px;margin-top:2px;font-family:var(--mono)}.ochip .oc-prog{height:4px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:6px;border:1px solid var(--border)}.ochip .oc-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .55s}.ochip .oc-foot{font-size:9.5px;color:var(--dim);margin-top:5px;font-family:var(--mono);display:flex;justify-content:space-between}.ochip.rush{border-color:rgba(255,178,74,.48)}.ochip.rush .oc-cust::after{content:"加急";font-size:8px;color:#04111a;background:var(--amber);padding:0 5px;border-radius:7px;margin-left:5px;vertical-align:middle}.ochip.done{opacity:.62;border-color:rgba(61,220,151,.34)}.ochip.done .oc-cust{color:var(--green)}.ochip.late{border-color:rgba(255,107,123,.48)}.ochip.late .oc-foot{color:var(--red)}.ochip.just-moved{animation:arrive 1s ease}
.ops-panel{padding:11px 14px;display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:8px;align-items:center}.act-btn{padding:7px 14px;border-radius:9px;border:1px solid var(--border2);background:var(--panel2);color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}.act-btn:hover{border-color:var(--cyan);color:var(--txt);background:rgba(57,208,255,.08)}.act-btn.primary{background:var(--grad);color:#04111a;border:none;font-weight:700}.act-btn.primary:hover{filter:brightness(1.1);box-shadow:0 4px 14px rgba(57,208,255,.3)}.act-btn.good{border-color:rgba(61,220,151,.4);color:var(--green)}.act-btn.good:hover{background:rgba(61,220,151,.1)}.act-btn.warn{border-color:rgba(255,178,74,.4);color:var(--amber)}.act-btn.warn:hover{background:rgba(255,178,74,.1)}.act-btn.bad{border-color:rgba(255,107,123,.4);color:var(--red)}.act-btn.bad:hover{background:rgba(255,107,123,.1)}.act-btn:disabled{opacity:.35;cursor:not-allowed}
.num-input{width:56px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:6px 8px;font-size:13px;font-family:var(--mono);text-align:center}.num-input:focus{outline:none;border-color:var(--cyan)}.sel{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:6px 8px;font-size:12px;font-family:inherit;flex:1}
.todo-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px}.todo-item:last-child{border-bottom:none}.todo-item .ti{flex:1;min-width:0}.todo-item .tc{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.todo-item .tm{font-size:10px;color:var(--faint);font-family:var(--mono);margin-top:1px}.todo-item .tstat{font-size:9px;padding:1px 7px;border-radius:10px;font-family:var(--mono);flex:0 0 auto}.tstat.inquiry{background:rgba(91,139,255,.15);color:var(--blue)}.tstat.accepted{background:rgba(91,139,255,.15);color:var(--blue)}.tstat.ready{background:rgba(255,178,74,.15);color:var(--amber)}.tstat.in_production{background:rgba(57,208,255,.15);color:var(--cyan)}.tstat.trial_pending{background:rgba(167,139,250,.15);color:var(--violet)}.tstat.delivered{background:rgba(61,220,151,.15);color:var(--green)}
.purchase-panel{padding:11px 14px;display:flex;flex-direction:column;gap:8px}.inv-display{display:flex;gap:10px;font-size:11px;color:var(--dim);font-family:var(--mono);padding:4px 0 0;flex-wrap:wrap}.inv-display span b{color:var(--cyan)}
.event{padding:9px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);margin:8px 12px}.event:first-child{margin-top:4px}.event .et{font-size:12px;font-weight:600;margin-bottom:3px}.event .ed{font-size:11px;color:var(--dim);margin-bottom:7px}.event .ec{display:flex;gap:6px}
.tech-cat{font-size:10px;color:var(--faint);letter-spacing:1px;text-transform:uppercase;font-family:var(--mono);padding:8px 12px 4px}.tech-node{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:11.5px}.tech-node.locked{opacity:.35}.tech-node.researched .tn-name{color:var(--green)}.tech-node.researching .tn-name{color:var(--cyan)}.tech-node .tn-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tech-node .tn-cost{color:var(--amber);font-family:var(--mono);font-size:10px;flex:0 0 auto}.tech-node .tn-prog{font-size:9px;color:var(--cyan);font-family:var(--mono)}
.log{padding:8px 15px 12px;font-family:var(--mono);font-size:11px;line-height:1.85}.log .lr{display:flex;gap:9px;animation:fade .25s ease}.log .lr .ls{color:var(--faint);flex:0 0 30px}.log .lr.good{color:var(--green)}.log .lr.warn{color:var(--amber)}.log .lr.bad{color:var(--red)}.log .lr.info{color:var(--dim)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}.float{position:absolute;font-weight:800;font-size:17px;animation:fu 1.3s ease forwards;text-shadow:0 2px 6px #000;font-family:var(--mono)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}.toast{background:var(--elev);border:1px solid var(--border2);border-left:3px solid var(--cyan);padding:9px 13px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);max-width:340px;animation:tin .3s cubic-bezier(.2,.9,.3,1)}.toast.warn{border-left-color:var(--amber)}.toast.bad{border-left-color:var(--red)}.toast.good{border-left-color:var(--green)}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;text-align:center;font-size:13px;color:var(--dim)}#boot .ring{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--cyan);animation:spin 1s linear infinite;margin:0 auto 13px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.3);opacity:.65}}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}@keyframes flowbar{to{background-position:-200% 0}}@keyframes flow{to{background-position:12px 0}}@keyframes arrive{0%{box-shadow:0 0 0 2px var(--cyan),0 0 22px rgba(57,208,255,.55);transform:scale(1.05)}60%{box-shadow:0 0 0 1px rgba(57,208,255,.3)}100%{box-shadow:none;transform:none}}@keyframes breathe{50%{opacity:.4}}@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}@keyframes mcflash{0%{box-shadow:0 0 0 0 rgba(255,178,74,.6);border-color:var(--amber)}100%{box-shadow:0 0 0 16px rgba(255,178,74,0)}}@keyframes spotflash{0%{box-shadow:0 0 0 0 rgba(57,208,255,.5);background:rgba(57,208,255,.22)}100%{box-shadow:0 0 0 14px rgba(57,208,255,0)}}@keyframes glow{50%{box-shadow:0 0 20px rgba(255,178,74,.28)}}@keyframes fu{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-50px);opacity:0}}@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@media(max-width:1180px){main{grid-template-columns:300px 1fr 260px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot"><div><div class="ring"></div><div>正在初始化工厂…</div></div></div>
<header>
  <div class="brand"><div class="mark">星</div><div><h1 id="fac-name">星联精密 · PET吹瓶模智能工厂</h1><div class="sub">STANDALONE · 工厂运营模拟</div></div></div>
  <div class="status"><span class="si"></span><span class="st" id="status-txt">就绪</span></div>
  <div class="top-conn"><span class="dot"></span><span>单机版</span><button class="btn danger" id="btn-reset">重置工厂</button></div>
</header>
<main>
  <div class="col">
    <div class="card"><div class="card-h"><span class="t">全局操作</span></div><div class="ops-panel">
      <button class="act-btn primary" id="btn-adv1">推进 1 班</button>
      <div class="row"><input type="number" class="num-input" id="shift-n" value="6" min="1" max="12"><button class="act-btn" id="btn-advn">推进 N 班</button></div>
      <div class="row"><input type="number" class="num-input" id="pipe-n" value="3" min="0" max="12"><button class="act-btn" id="btn-pipe">一键流水线</button></div>
    </div></div>
    <div class="card" style="flex:1;min-height:0"><div class="card-h"><span class="t">订单操作</span><span class="n" id="oc-n">0</span></div><div class="card-body" id="order-actions"></div></div>
    <div class="card"><div class="card-h"><span class="t">采购钢料</span></div><div class="purchase-panel">
      <select class="sel" id="pur-grade"><option value="P20">P20 · 1800/块</option><option value="718H">718H · 3200/块</option><option value="S136">S136 · 5200/块</option></select>
      <div class="row"><input type="number" class="num-input" id="pur-qty" value="20" min="1" max="999" style="flex:1"><button class="act-btn" id="btn-pur">采购</button></div>
      <div id="inv-display" class="inv-display"></div>
    </div></div>
  </div>
  <div class="col">
    <div class="card"><div class="kbar" id="kbar"></div></div>
    <div class="spot hide" id="spot"><div class="sic spinic" id="spot-ic">gear</div><div class="stx" id="spot-txt"></div></div>
    <div class="banner hide" id="banner"><span>!</span><span id="banner-txt"></span></div>
    <div class="card" style="flex:1;min-height:160px"><div class="card-h"><span class="t">车间 · 设备实时</span><span class="n" id="m-n">-</span></div><div class="card-body floor" id="floor"></div></div>
    <div class="card pipe-wrap" style="flex:1.2;min-height:200px"><div class="card-h"><span class="t">订单流水线</span><span class="n" id="o-n">0</span></div><div class="card-body pipe" id="pipe"></div></div>
  </div>
  <div class="col">
    <div class="card"><div class="card-h"><span class="t">待处理事件</span><span class="n" id="ev-n">0</span></div><div class="card-body" id="events-panel" style="max-height:240px"></div></div>
    <div class="card" style="flex:1;min-height:0"><div class="card-h"><span class="t">科技研发</span><span class="n" id="tech-n">0</span></div><div class="card-body" id="tech-panel"></div></div>
    <div class="card" style="flex:1;min-height:0"><div class="card-h"><span class="t">工厂日志</span></div><div class="card-body log" id="log"></div></div>
  </div>
</main>
<div id="fx"></div><div id="toasts"></div>
<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var MOLD_LABEL={blow_mold:"PET吹瓶模",preform_mold:"注坯模",cap_mold:"瓶盖模"};
var PROCESS_LABEL={rough_cnc:"粗加工CNC",finish_cnc:"精加工CNC",edm:"EDM火花",wire_cut:"线切割",polish:"抛光",assembly:"装配"};
var MACHINE_TYPE_LABEL={cnc_mill:"CNC加工中心",edm:"EDM火花机",wire_cut:"线切割",trial_injector:"试模注塑机"};
var PROCESS_MACHINE={rough_cnc:"cnc_mill",finish_cnc:"cnc_mill",edm:"edm",wire_cut:"wire_cut",polish:null,assembly:null};
var ORDER_STATUS_LABEL={inquiry:"询价",accepted:"已接单",designing:"设计中",ready:"待排产",in_production:"加工中",trial_pending:"待试模",delivered:"已交付",overdue:"逾期"};
var BASE_STEP_TIME={rough_cnc:2,finish_cnc:3,edm:2,wire_cut:2,polish:1,assembly:1};
var STEEL_PRICE={P20:1800,"718H":3200,S136:5200};
var MOLD_SPECS={blow_mold:{routing:["rough_cnc","finish_cnc","edm","polish","assembly"],steelGrade:"S136",basePrice:480000},preform_mold:{routing:["finish_cnc","edm","assembly"],steelGrade:"718H",basePrice:260000},cap_mold:{routing:["finish_cnc","assembly"],steelGrade:"P20",basePrice:90000}};
var STEEL_PER_QTY={blow_mold:4,preform_mold:2,cap_mold:1};

function findOrder(id){for(var i=0;i<G.orders.length;i++){if(G.orders[i].id===id)return G.orders[i]}return undefined}
function findMachine(id){for(var i=0;i<G.machines.length;i++){if(G.machines[i].id===id)return G.machines[i]}return undefined}
function logState(text,kind){G.log.unshift({shift:G.shift,text:text,kind:kind||"info"});if(G.log.length>60)G.log.pop()}
function ok(msg,data){return{ok:true,message:msg,data:data}}
function fail(msg){return{ok:false,message:msg}}
function clampRep(v){return Math.max(0,Math.min(100,v))}
function collapseBenchSteps(order,eff){
  for(var i=0;i<order.steps.length;i++){
    var step=order.steps[i];
    if(step.status==="pending"&&PROCESS_MACHINE[step.process]===null){
      step.status="done";
      var q=88+Math.floor(Math.random()*10);
      if(step.process==="polish")q+=eff.polishQualityBonus;
      q+=eff.qualityBonus;
      step.quality=q;
    }else if(step.status==="pending"){break}
  }
}
function nextSchedulableStep(order){
  for(var i=0;i<order.steps.length;i++){
    var s=order.steps[i];
    if(s.status==="pending"&&PROCESS_MACHINE[s.process]!==null)return s;
  }
  return undefined;
}
function allStepsDone(order){
  if(!order.steps.length)return false;
  for(var i=0;i<order.steps.length;i++){if(order.steps[i].status!=="done")return false}
  return true;
}

function acceptInquiry(orderId){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var order=findOrder(orderId);
  if(!order)return fail("未找到订单 "+orderId+"。");
  if(order.status!=="inquiry")return fail(orderId+" 当前为"+ORDER_STATUS_LABEL[order.status]+"，不能接单。");
  order.status="accepted";
  order.acceptedAtShift=G.shift;
  logState("接下 "+order.customer+" 的订单 "+orderId+"（"+MOLD_LABEL[order.moldType]+" x"+order.qty+"，报价 Y"+order.price+"）。","good");
  return ok("已接单 "+orderId+"。下一步：开始设计。");
}
function startDesign(orderId){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var order=findOrder(orderId);
  if(!order)return fail("未找到订单 "+orderId+"。");
  if(order.status!=="accepted")return fail(orderId+" 必须已接单才能设计。");
  var spec=MOLD_SPECS[order.moldType];
  order.steps=spec.routing.map(function(p){return{process:p,status:"pending"}});
  order.steelGrade=spec.steelGrade;
  order.steelNeeded=STEEL_PER_QTY[order.moldType]*order.qty;
  order.steelConsumed=false;
  order.designQuality=65+Math.floor(Math.random()*30);
  collapseBenchSteps(order,getTechEffects(G));
  order.status=allStepsDone(order)?"trial_pending":"ready";
  var route=spec.routing.map(function(p){return PROCESS_LABEL[p]}).join(" > ");
  logState(orderId+" 设计完成。工艺路线："+route+"；需钢料 "+order.steelGrade+"x"+order.steelNeeded+" 块；设计水平 "+order.designQuality+"。","info");
  return ok(orderId+" 设计完成，工艺 "+order.steps.length+" 步，需 "+order.steelGrade+"x"+order.steelNeeded+"。");
}
function scheduleJob(orderId,machineId){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var order=findOrder(orderId);
  if(!order)return fail("未找到订单 "+orderId+"。");
  if(order.status!=="ready"&&order.status!=="in_production")return fail(orderId+" 当前"+ORDER_STATUS_LABEL[order.status]+"，无法排产。");
  var step=nextSchedulableStep(order);
  if(!step){
    if(allStepsDone(order)){order.status="trial_pending";return ok(orderId+" 已无待加工工序，可试模。")}
    return fail(orderId+" 没有可排产的工序。");
  }
  var needType=PROCESS_MACHINE[step.process];
  var machine;
  if(machineId){
    machine=findMachine(machineId);
    if(!machine)return fail("未找到机床 "+machineId+"。");
    if(machine.type!==needType)return fail(machine.name+" 类型不匹配。");
    if(machine.status!=="idle")return fail(machine.name+" 当前不可用。");
  }else{
    for(var i=0;i<G.machines.length;i++){if(G.machines[i].type===needType&&G.machines[i].status==="idle"){machine=G.machines[i];break}}
    if(!machine)return fail("没有空闲的"+MACHINE_TYPE_LABEL[needType]+"。");
  }
  if(!order.steelConsumed){
    var inv=null;
    for(var j=0;j<G.inventory.length;j++){if(G.inventory[j].grade===order.steelGrade){inv=G.inventory[j];break}}
    var have=inv?inv.qty:0;
    if(have<order.steelNeeded)return fail("钢料不足：需 "+order.steelGrade+"x"+order.steelNeeded+"，库存仅 "+have+"。");
    inv.qty-=order.steelNeeded;
    order.steelConsumed=true;
    logState(orderId+" 投料 "+order.steelGrade+"x"+order.steelNeeded+"。","info");
  }
  var eff=getTechEffects(G);
  var effSpeed=machine.speed+eff.globalSpeedBonus;
  if(machine.type==="cnc_mill")effSpeed+=eff.cncSpeedBonus;
  else if(machine.type==="edm")effSpeed+=eff.edmSpeedBonus;
  var rawTime=Math.ceil((BASE_STEP_TIME[step.process]*order.qty)/effSpeed);
  var time=Math.max(1,rawTime-eff.scheduleTimeBonus);
  step.status="running";step.machineId=machine.id;step.remaining=time;step.total=time;
  machine.status="running";machine.orderId=order.id;machine.remaining=time;machine.total=time;
  order.status="in_production";
  logState(orderId+" ["+PROCESS_LABEL[step.process]+"] 上 "+machine.name+"，预计 "+time+" 班次。","info");
  return ok(orderId+" ["+PROCESS_LABEL[step.process]+"] 已排上 "+machine.name+"（"+time+" 班次）。");
}
function unscheduleJob(orderId){
  var order=findOrder(orderId);
  if(!order)return fail("未找到订单 "+orderId+"。");
  var step=null;
  for(var i=0;i<order.steps.length;i++){if(order.steps[i].status==="running"){step=order.steps[i];break}}
  if(!step)return fail(orderId+" 当前没有在机工序可取消。");
  var machine=step.machineId?findMachine(step.machineId):undefined;
  step.status="pending";step.machineId=undefined;step.remaining=undefined;step.total=undefined;
  if(machine){machine.status="idle";machine.orderId=undefined;machine.remaining=undefined;machine.total=undefined}
  logState(orderId+" ["+PROCESS_LABEL[step.process]+"] 已撤下，机床已释放。","warn");
  return ok(orderId+" 在机工序已取消，机床已释放。");
}
function purchaseMaterial(grade,qty){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var price=STEEL_PRICE[grade];
  if(!price)return fail("未知钢料牌号 "+grade+"。");
  if(qty<=0)return fail("采购数量必须大于 0。");
  var cost=Math.round(price*qty*(1-getTechEffects(G).materialDiscount));
  if(G.cash<cost)return fail("现金不足：需 Y"+cost+"，仅余 Y"+G.cash+"。");
  G.cash-=cost;
  var inv=null;
  for(var i=0;i<G.inventory.length;i++){if(G.inventory[i].grade===grade){inv=G.inventory[i];break}}
  if(!inv){inv={grade:grade,qty:0};G.inventory.push(inv)}
  inv.qty+=qty;
  logState("采购钢料 "+grade+"x"+qty+"，花费 Y"+cost+"。","info");
  return ok("已采购 "+grade+"x"+qty+"，花费 Y"+cost+"，库存现 "+inv.qty+"。");
}
function runTrial(orderId){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var order=findOrder(orderId);
  if(!order)return fail("未找到订单 "+orderId+"。");
  if(order.status!=="trial_pending")return fail(orderId+" 必须待试模才能试模。");
  var injector=null;
  for(var i=0;i<G.machines.length;i++){if(G.machines[i].type==="trial_injector"){injector=G.machines[i];break}}
  if(injector&&injector.status!=="idle")return fail("试模注塑机当前不可用。");
  var eff=getTechEffects(G);
  var sum=0;
  for(var i=0;i<order.steps.length;i++){sum+=order.steps[i].quality||80}
  var avgStep=sum/Math.max(1,order.steps.length);
  var noise=Math.random()*2*eff.trialNoise-eff.trialNoise;
  var score=avgStep*0.6+(order.designQuality||75)*0.4+noise;
  var pass=score>=eff.trialThreshold;
  if(pass){
    order.trialPassed=true;
    logState(orderId+" 试模合格（质量分 "+score.toFixed(1)+"）。可交付。","good");
    return ok(orderId+" 试模合格（质量分 "+score.toFixed(1)+"），可交付。");
  }
  var worst=null;
  for(var i=0;i<order.steps.length;i++){
    var s=order.steps[i];
    if(PROCESS_MACHINE[s.process]!==null&&s.status==="done"){
      if(!worst||(s.quality||100)<(worst.quality||100))worst=s;
    }
  }
  if(worst){
    worst.status="pending";worst.quality=undefined;
    order.status="ready";
    logState(orderId+" 试模不合格（"+score.toFixed(1)+"），返工 ["+PROCESS_LABEL[worst.process]+"]。","warn");
    return ok(orderId+" 试模不合格（"+score.toFixed(1)+"），需返工 ["+PROCESS_LABEL[worst.process]+"]。");
  }
  order.status="ready";
  return ok(orderId+" 试模不合格，请重新排产加工。");
}
function deliverOrder(orderId){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var order=findOrder(orderId);
  if(!order)return fail("未找到订单 "+orderId+"。");
  if(order.status!=="trial_pending"||!order.trialPassed)return fail(orderId+" 必须试模合格才能交付。");
  order.status="delivered";order.deliveredAtShift=G.shift;
  G.cash+=order.price;
  var onTime=G.shift<=order.dueShift;
  G.reputation=clampRep(G.reputation+(onTime?4:-3));
  logState("交付 "+orderId+" 给 "+order.customer+"，回款 Y"+order.price+(onTime?"（按时交付，声誉+4）":"（逾期交付，声誉-3）")+"。",onTime?"good":"warn");
  return ok(orderId+" 已交付，回款 Y"+order.price+"，声誉 "+G.reputation+"。");
}
function handleEvent(eventId,choice){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var ev=null;
  for(var i=0;i<G.events.length;i++){if(G.events[i].id===eventId){ev=G.events[i];break}}
  if(!ev)return fail("未找到事件 "+eventId+"。");
  if(ev.resolved)return fail(eventId+" 已处理。");
  if(ev.type==="machine_breakdown"){
    var machine=ev.payload&&ev.payload.machineId?findMachine(ev.payload.machineId):undefined;
    if(choice==="repair"){
      if(G.cash<REPAIR_COST)return fail("现金不足，维修需 Y"+REPAIR_COST+"。");
      G.cash-=REPAIR_COST;
      if(machine){
        machine.status="idle";machine.orderId=undefined;machine.remaining=undefined;machine.total=undefined;
        for(var i=0;i<G.orders.length;i++){
          for(var j=0;j<G.orders[i].steps.length;j++){
            var s=G.orders[i].steps[j];
            if(s.machineId===machine.id&&s.status==="running"){s.status="pending";s.machineId=undefined;s.remaining=undefined;s.total=undefined}
          }
        }
      }
      ev.resolved=true;
      logState("维修 "+(machine?machine.name:"设备")+" 完成，花费 Y"+REPAIR_COST+"。","info");
    }else{
      if(machine)machine.status="broken";
      ev.resolved=true;
      logState("暂缓维修 "+(machine?machine.name:"设备")+"。","warn");
    }
  }else if(ev.type==="rush_order"){
    if(choice==="accept"){
      var o=generateInquiry(G,G.shift,{rush:true});
      G.orders.push(o);
      logState("接下紧急单 "+o.id+"："+o.customer+"（"+MOLD_LABEL[o.moldType]+" x"+o.qty+"，Y"+o.price+"）。","good");
    }else{
      G.reputation=clampRep(G.reputation-1);
      logState("拒绝紧急插单，声誉 -1。","warn");
    }
    ev.resolved=true;
  }else if(ev.type==="material_delay"){
    if(choice==="expedite"){
      if(G.cash<8000)return fail("现金不足，加急需 Y8000。");
      G.cash-=8000;
      logState("加急钢料到货，花费 Y8000。","info");
    }else{
      var grade=(ev.payload&&ev.payload.grade)||"S136";
      for(var i=0;i<G.inventory.length;i++){if(G.inventory[i].grade===grade){G.inventory[i].qty=Math.max(0,G.inventory[i].qty-10);break}}
      logState("等待钢料 "+grade+"，库存 -10。","warn");
    }
    ev.resolved=true;
  }else if(ev.type==="customer_urge"){
    var order=ev.payload&&ev.payload.orderId?findOrder(ev.payload.orderId):undefined;
    if(choice==="apologize"){
      G.reputation=clampRep(G.reputation-2);
      logState((order?order.customer:"客户")+"催货，安抚致歉，声誉 -2。","warn");
    }else{
      G.reputation=clampRep(G.reputation-4);
      logState("无视 "+(order?order.customer:"客户")+"催货，声誉 -4。","bad");
    }
    ev.resolved=true;
  }
  return ok("事件 "+eventId+" 已处理。");
}
function spawnRandomEvent(eff){
  var active=G.events.filter(function(e){return!e.resolved});
  if(active.length>=3)return false;
  var types=["machine_breakdown","rush_order","material_delay","customer_urge"];
  if(eff.preventBreakdown)types=types.filter(function(t){return t!=="machine_breakdown"});
  if(eff.preventMaterialDelay)types=types.filter(function(t){return t!=="material_delay"});
  if(!types.length)return false;
  var type=types[Math.floor(Math.random()*types.length)];
  var id="E-"+G.shift+"-"+Math.floor(Math.random()*900+100);
  var ev;
  if(type==="machine_breakdown"){
    var running=G.machines.filter(function(m){return m.status==="running"});
    if(!running.length)return false;
    var m=running[Math.floor(Math.random()*running.length)];
    m.status="broken";
    ev={id:id,type:type,shift:G.shift,title:"设备故障",detail:m.name+" 突发故障停机，在制工序暂停。",resolved:false,payload:{machineId:m.id}};
  }else if(type==="rush_order"){
    ev={id:id,type:type,shift:G.shift,title:"紧急插单",detail:"客户加急下单，溢价 30%，是否接？",resolved:false};
  }else if(type==="material_delay"){
    var grades=["P20","718H","S136"];
    var grade=grades[Math.floor(Math.random()*grades.length)];
    ev={id:id,type:type,shift:G.shift,title:"钢料延迟",detail:grade+" 到货延迟，加急 Y8000 或等待（库存 -10）。",resolved:false,payload:{grade:grade}};
  }else if(type==="customer_urge"){
    var pending=G.orders.filter(function(o){return o.status==="in_production"||o.status==="trial_pending"||o.status==="ready"});
    if(!pending.length)return false;
    var o=pending[Math.floor(Math.random()*pending.length)];
    ev={id:id,type:type,shift:G.shift,title:"客户催货",detail:o.customer+" 催促订单 "+o.id+" 进度。",resolved:false,payload:{orderId:o.id}};
  }
  G.events.unshift(ev);
  logState("[事件] "+ev.title+"："+ev.detail,"warn");
  return true;
}
function advanceShiftOnce(){
  var eff=getTechEffects(G);
  G.shift+=1;
  var completed=[];
  var res={completed:completed,eventSpawned:false,bankrupt:false};
  for(var i=0;i<G.machines.length;i++){
    var machine=G.machines[i];
    if(machine.status==="running"&&machine.remaining!=null){
      machine.remaining-=1;
      var order=machine.orderId?findOrder(machine.orderId):undefined;
      if(order){
        for(var j=0;j<order.steps.length;j++){
          if(order.steps[j].machineId===machine.id&&order.steps[j].status==="running"){
            if(order.steps[j].remaining!=null)order.steps[j].remaining=machine.remaining;
          }
        }
      }
      if(machine.remaining<=0){
        if(order){
          for(var j=0;j<order.steps.length;j++){
            var step=order.steps[j];
            if(step.machineId===machine.id&&step.status==="running"){
              step.status="done";
              var q=78+machine.speed*10+(Math.random()*14-7);
              if(step.process==="rough_cnc"||step.process==="finish_cnc")q+=eff.cncQualityBonus;
              q+=eff.qualityBonus;
              step.quality=Math.round(clampRep(q));
              step.remaining=undefined;
              completed.push(order.id+" ["+PROCESS_LABEL[step.process]+"] 完成");
              collapseBenchSteps(order,eff);
              if(allStepsDone(order)){order.status="trial_pending";completed.push(order.id+" 全部工序完成，可试模")}
              break;
            }
          }
        }
        machine.status="idle";machine.orderId=undefined;machine.remaining=undefined;machine.total=undefined;
      }
    }
  }
  for(var i=0;i<G.orders.length;i++){
    var o=G.orders[i];
    if(!o.lateCharged&&o.status!=="inquiry"&&o.status!=="delivered"&&o.status!=="overdue"&&G.shift>o.dueShift){
      o.lateCharged=true;G.cash-=o.penalty;G.reputation=clampRep(G.reputation-6);
      logState(o.id+"（"+o.customer+"）逾期，扣罚金 Y"+o.penalty+"，声誉 -6。","bad");
    }
  }
  G.cash-=eff.overhead;
  if(Math.random()<0.28)res.eventSpawned=spawnRandomEvent(eff);
  if(Math.random()<0.3){
    var inq=generateInquiry(G,G.shift);
    G.orders.push(inq);
    logState("新询价 "+inq.id+"："+inq.customer+"（"+MOLD_LABEL[inq.moldType]+" x"+inq.qty+"，Y"+inq.price+"）。","info");
  }
  if(G.tech.researching){
    G.tech.researching.remaining-=1;
    if(G.tech.researching.remaining<=0){
      var done=G.tech.researching.nodeId;
      G.tech.researched.push(done);
      var node=TECH_NODE[done];
      G.tech.researching=undefined;
      logState("[科技] "+(node?node.name:done)+" 研发完成。","good");
      res.techCompleted=node?node.name:done;
    }
  }
  if(G.cash<0){G.gameOver=true;logState("现金耗尽（Y"+G.cash+"），工厂破产。","bad");res.bankrupt=true}
  for(var i=0;i<completed.length;i++)logState(completed[i],"good");
  return res;
}
function advanceShift(){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var r=advanceShiftOnce();
  return ok("第 "+G.shift+" 班次结束。"+(r.completed.length?"完成："+r.completed.join("；")+"。":"")+"现金 Y"+G.cash+"，声誉 "+G.reputation+(r.bankrupt?"，工厂已破产":"")+"。");
}
function advanceShifts(count){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var n=Math.max(1,Math.min(12,Math.floor(count)));
  var fromShift=G.shift+1;
  var allCompleted=[],techDone=[],eventCount=0,ran=0;
  for(var i=0;i<n;i++){
    if(G.gameOver)break;
    var r=advanceShiftOnce();
    ran++;allCompleted=allCompleted.concat(r.completed);
    if(r.eventSpawned)eventCount++;
    if(r.techCompleted)techDone.push(r.techCompleted);
  }
  var parts=["连续推进 "+ran+" 个班次（第 "+fromShift+"-"+G.shift+" 班）"];
  if(allCompleted.length)parts.push("共完成 "+allCompleted.length+" 项工序");
  if(techDone.length)parts.push("科技研发完成："+techDone.join("、"));
  if(eventCount)parts.push("期间触发 "+eventCount+" 个待处理事件");
  var summary=parts.join("；");
  logState(summary+"。现金 Y"+G.cash+"，声誉 "+G.reputation+"。","info");
  return ok(summary+"。现金 Y"+G.cash+"，声誉 "+G.reputation+(G.gameOver?"，工厂已破产":"")+"。");
}
function research(nodeId){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var node=TECH_NODE[nodeId];
  if(!node)return fail("未知科技 "+nodeId+"。");
  if(G.tech.researched.indexOf(nodeId)>=0)return fail(node.name+" 已研发完成。");
  if(G.tech.researching)return fail("正在研发中，需完成后再启动新项目。");
  var missing=node.requires.filter(function(r){return G.tech.researched.indexOf(r)<0});
  if(missing.length)return fail(node.name+" 的前置科技未满足。");
  if(G.cash<node.cost)return fail("现金不足：研发 "+node.name+" 需 Y"+node.cost+"。");
  G.cash-=node.cost;
  G.tech.researching={nodeId:nodeId,remaining:node.researchShifts,total:node.researchShifts};
  logState("启动研发 ["+node.name+"]，投入 Y"+node.cost+"，预计 "+node.researchShifts+" 班次完成。","info");
  return ok("已启动研发 "+node.name+"（投入 Y"+node.cost+"，"+node.researchShifts+" 班次）。");
}
function runPipeline(opts){
  if(G.gameOver)return fail("工厂已破产，请重置游戏。");
  var accepted=[],designed=[],scheduled=[],blocked=[];
  for(var i=0;i<G.orders.length;i++){
    if(G.orders[i].status==="inquiry"){var r=acceptInquiry(G.orders[i].id);if(r.ok)accepted.push(G.orders[i].id)}
  }
  for(var i=0;i<G.orders.length;i++){
    if(G.orders[i].status==="accepted"||G.orders[i].status==="designing"){var r=startDesign(G.orders[i].id);if(r.ok)designed.push(G.orders[i].id)}
  }
  for(var i=0;i<G.orders.length;i++){
    if(G.orders[i].status==="ready"||G.orders[i].status==="in_production"){
      var r=scheduleJob(G.orders[i].id);
      if(r.ok)scheduled.push(G.orders[i].id);else blocked.push(G.orders[i].id);
    }
  }
  var advanced=null;
  var n=(opts&&opts.advanceShifts)||0;
  if(n>0)advanced=advanceShifts(n).message;
  var parts=[];
  if(accepted.length)parts.push("接单 "+accepted.length);
  if(designed.length)parts.push("设计 "+designed.length);
  if(scheduled.length)parts.push("排产 "+scheduled.length);
  if(blocked.length)parts.push("未排产 "+blocked.length);
  if(advanced)parts.push(advanced);
  var summary=parts.length?parts.join("；"):"无待处理的询价/排产任务。";
  logState("[流水线] "+summary,"info");
  return ok("流水线执行完成："+summary+" 现金 Y"+G.cash+"，声誉 "+G.reputation+(G.gameOver?"，工厂已破产":"")+"。");
}

// ===== ACTIONS =====
function applyResult(result,kind){
  if(!result.ok){toast(result.message,"bad");return}
  var type="info";
  if(kind==="deliver_order")type="good";
  else if(kind==="run_trial")type=/合格/.test(result.message)?"good":"warn";
  else if(kind==="advance_shift"||kind==="advance_shifts")type=/破产|逾期|故障/.test(result.message)?"warn":"info";
  toast(result.message,type);
}
function doAction(fn,kind){
  if(G&&G.gameOver){toast("工厂已破产，请重置。","bad");return}
  prevCash=G.cash;
  var result=fn();
  applyResult(result,kind);
  if(result.ok&&G.cash!==prevCash){
    var d=G.cash-prevCash;
    floatText((d>0?"+":"")+"Y"+Math.round(d/1000)+"k",d>0?"var(--green)":"var(--red)");
    bumpKPI("cash");
  }
  saveGame();renderAll();renderSpot(kind,result.message);
  if(G.gameOver)toast("工厂破产！点击「重置工厂」重新开始。","bad");
}
